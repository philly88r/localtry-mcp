name: CI

# Verifies every pull request, including the ones LocalTry engineering opens.
# This workflow runs untrusted pull-request code, so it has read-only access
# and no secrets. Results reach LocalTry through engineering-report.yml.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck and tests
        run: npm run check

      - name: Release reporter tests
        run: node --test .github/scripts/engineering-release.test.mjs
