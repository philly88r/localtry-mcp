name: Deploy

# The only production release path. Every push to main (a merged pull request,
# or the owner's own push) is verified and deployed here. Deployment
# credentials live in the "production" environment, which only main can use.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # move release/* service tags
  pull-requests: write # label reported pull requests as released
  actions: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 21106a436b21f19b551ba4ca8820aa6e
      ENGINEERING_RELEASE_SECRET: ${{ secrets.ENGINEERING_RELEASE_SECRET }}
      GITHUB_TOKEN: ${{ github.token }}
      FAILURE_LOG: /tmp/localtry-deploy.log
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Skip superseded commits
        id: current
        run: |
          git fetch --tags --force origin main
          if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
            echo "A newer commit is on main; it will deploy this change too."
            echo "superseded=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.current.outputs.superseded != 'true'
        with:
          node-version: 24
          cache: npm

      - name: Verify and deploy
        if: steps.current.outputs.superseded != 'true'
        run: |
          set -o pipefail
          {
            npm ci
            npm run check
            npm run deploy
          } 2>&1 | tee -a "$FAILURE_LOG"

      - name: Report release to LocalTry
        if: steps.current.outputs.superseded != 'true'
        run: node .github/scripts/engineering-release.mjs deployed

      - name: Report failed release to LocalTry
        if: failure() && steps.current.outputs.superseded != 'true'
        run: node .github/scripts/engineering-release.mjs deploy-failed
